[project]
name = "tack-expr"
version = "0.1.0"
description = "Field expressions for Tack: VTK calculator syntax over tack.dataset fields"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Kitware, Inc." }]
keywords = ["gpu", "expressions", "fields", "finite elements", "vtk", "calculator"]
dependencies = [
    "tack-vis>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tack_expr"]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120

